<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>แบรนด์ของฉัน — Pidlok Hub</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .brands-page{max-width:760px;margin:0 auto;padding:32px 16px 80px}
    .brands-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
    .brands-head h1{font-size:26px;letter-spacing:-.6px}
    .brands-head p{color:var(--muted);font-size:13px;margin-top:4px}
    .brand-list{display:grid;gap:12px}
    .brand-card{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .brand-card .mono{width:52px;height:52px;border-radius:14px;background:var(--lavender);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;overflow:hidden}
    .brand-card .mono img{width:100%;height:100%;object-fit:cover}
    .brand-card h2{font-size:15px;font-weight:650}
    .brand-card .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:#f2f2f5;font-size:10px;color:#6c6c76}
    .pill.live{background:#e7f7ee;color:#167a43}
    .brand-actions{display:flex;gap:6px}
    .brand-actions .btn{min-height:38px;padding:8px 12px;font-size:12px}
    .empty{padding:40px 20px;text-align:center;border:1px dashed #d6d3e2;border-radius:16px;color:var(--muted);font-size:13px;background:#fff}
    .create-form{display:grid;gap:14px}
    .create-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5f5c68}
    .create-form input{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
    .slug-field{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .slug-field span{padding:0 4px 0 12px;color:var(--muted);font-size:14px;white-space:nowrap}
    .slug-field input{border:0;padding-left:2px;flex:1;min-width:0}
    .template-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .template-choice label{flex-direction:row;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}
    .template-choice label:has(input:checked){border-color:var(--purple);background:#faf9ff}
    .template-choice input{min-height:0;margin-top:3px}
    .template-choice b{display:block;font-size:13px;color:var(--ink)}
    .hint{font-size:11px;color:var(--muted)}
    .error{font-size:12px;color:#c2410c}
    .account{display:flex;justify-content:space-between;align-items:center;margin-top:28px;font-size:12px;color:var(--muted)}
    @media(max-width:560px){.brand-card{grid-template-columns:44px 1fr}.brand-card .mono{width:44px;height:44px}.brand-actions{grid-column:1/-1}.brand-actions .btn{flex:1}.template-choice{grid-template-columns:1fr}.brands-head{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/admin" aria-label="Pidlok Hub"><span class="brand-mark">p<span>h</span></span><span>pidlok<span class="brand-light">hub</span><small>LOCAL STUDIO</small></span></a>
  </header>
  <main class="brands-page">
    <div class="brands-head">
      <div><h1>แบรนด์ของฉัน</h1><p>แต่ละแบรนด์มีหน้าร้านของตัวเองที่ pidlokhub.com/ชื่อแบรนด์</p></div>
      <button class="btn primary" id="new-brand">+ เพิ่มแบรนด์</button>
    </div>
    <div id="brands" class="brand-list"><div class="empty">กำลังโหลด…</div></div>
    <div class="account"><span id="who"></span><a class="text-action" href="/cdn-cgi/access/logout">ออกจากระบบ</a></div>
  </main>
  <dialog id="editor" aria-labelledby="dialog-title"><div id="editor-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/admin.js"></script>
</body>
</html>
